name: Arabian Shield GPM Processing

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin python3-gdal python3-numpy python3-scipy

      - name: Run GPM processing
        run: python3 process_gpm.py

      - name: Upload structural raster outputs
        uses: actions/upload-artifact@v4
        with:
          name: gpm-structural-rasters
          path: |
            lineament_distance.tif
            lineament_density.tif
